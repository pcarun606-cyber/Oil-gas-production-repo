command:
  - python
  - app.py

env:
  - name: STREAMLIT_SERVER_PORT
    value: "8501"
  - name: STREAMLIT_SERVER_ADDRESS
    value: "localhost"
  - name: STREAMLIT_LOGGER_LEVEL
    value: "info"
  - name: STREAMLIT_CLIENT_TOOLBAR_MODE
    value: "viewer"
  - name: STREAMLIT_THEME_PRIMARY_COLOR
    value: "#00d4ff"
  - name: STREAMLIT_THEME_BACKGROUND_COLOR
    value: "#2d3748"
  - name: STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR
    value: "#1a202c"
  - name: STREAMLIT_THEME_TEXT_COLOR
    value: "#ffffff"
  - name: DATABRICKS_HOST
    value: "https://your-workspace-url.azuredatabricks.net"
  - name: DATABRICKS_TOKEN
    value: "your_databricks_personal_access_token"
  - name: DATABRICKS_CATALOG
    value: "oilgasproduction"
  - name: DATABRICKS_SCHEMA
    value: "oilgasproductionschema"
  - name: DATABRICKS_CLUSTER_ID
    value: "oilgascluster"

expose:
  - path: /
    port: 8501
    protocol: http

metadata:
  name: production-dashboard
  description: Oil & Gas Production Surveillance Dashboard
  version: "1.0.0"
  author: Production Analytics Team

ports:
  - name: http
    port: 8501
    protocol: TCP

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

healthcheck:
  enabled: true
  path: /_stcore/health
  interval: 30
  timeout: 10
  retries: 3
